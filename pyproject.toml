[project]
name = "wisdom_automated_demo_creator"
version = "0.1.0"
description = "Build complete WisdomAI demos (Snowflake data, domain context, Live App, agent, script) from one approved plan"
requires-python = ">=3.11"
dependencies = [
  # WisdomAI GraphQL client (src/wisdomai)
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "websockets>=12.0",
  "tomli-w>=1.0",
  # demo pipeline
  "snowflake-connector-python[pandas]>=3.12",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16",
  "duckdb>=1.1",
  "sqlglot>=25",
  "pyyaml>=6",
  "openpyxl>=3.1",
  "reportlab>=4",
  "faker>=26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
demo = "demo_creator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs network or a full data generation run"]
