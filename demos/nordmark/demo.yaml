wisdom:
  deployment: proddemo
  workspace_id: ET_WORKSPACE_01dc4f2105194dc286b9d69df2a89024   # Default Organization: the Ali-TD Teradata connection lives here
  connection: {name: Snowflake Demo, create: false}            # existing shared connection (user WISDOMAI_PROD); NORDMARK_POC added to its filter by hand
  federated_sources:
    - connection: Ali-TD                                        # read-only Teradata (Ali Alladin); never created, updated or refreshed by the pipeline
      database: wisdomai
      dialect: teradata
      tables: [RTL_DIM_SUPPLIER, RTL_DIM_PRODUCT, RTL_FACT_PURCHASE_ORDER_LINE, RTL_VW_PURCHASE_ORDER]
      description: Grosshallen's inherited import-purchasing platform on Teradata — suppliers, the imported non-food SKU master and inbound purchase-order lines (ordered and received quantities and days late). Join to NORDMARK_POC.ANALYTICS.NONFOOD_ASSORTMENT and NONFOOD_AVAILABILITY_MONTHLY on PRODUCT_KEY and SUPPLIER_KEY.
  domain_name: Nordmark Dagligvaror
  domain_description: Fictional Swedish grocery group (banners Kronmat discount, Torghallen neighbourhood, Grosshallen hypermarket acquired January 2025). Demo today is 2026-09-30; data spans 2024-10-01 to 2026-09-30. Store POS mart in Snowflake NORDMARK_POC.ANALYTICS; Grosshallen import purchasing (suppliers and purchase orders) federated read-only from Teradata (wisdomai.RTL_*).
  dialect: snowflake
  bootstrap: 02_wace_bootstrap.md
  knowledge_csv: knowledge.csv
  metrics_csv: metrics.csv
  reviewed_by:
  lookup_columns: [STORES.STORE_NAME, STORES.BANNER, STORES.REGION, NEIGHBORHOODS.CATCHMENT_TYPE, PRODUCT_CATEGORIES.CATEGORY_NAME, PROMOTIONS.PROMOTION_NAME, LOYALTY_ACTIVITY_MONTHLY.SEGMENT, KAMPANJ.KAMPANJ_NAMN, KAMPANJ.TAKTIK_TYP, KAMPANJ.KEDJA, ARTIKEL.ARTIKEL_NAMN, ARTIKEL.KATEGORI]
  eval: {run_count: 3, experimental_mode: EXPERIMENTAL_MODE_NONE, pass_threshold: 0.9}
  context_mode: extractor
  extraction: {accept: [knowledge, synonyms, metrics, reviewed_queries, skills], coverage_threshold: 0.9, batch_size: 3}
  skills:                                                       # Revision 2: codified procedures so the same question returns the same grid (extractor first, direct create as fallback)
    - {file: skills/kampanjrapport.md}
    - {file: skills/prognosavvikelse.md}
    - {file: skills/orderjustering-utkast.md}

script:
  template: docs/templates/demo_script_example.md
  output: DEMO_SCRIPT.md

manual_steps:
  - Add NORDMARK_POC to the database filter of the "Snowflake Demo" connection in Default Organization (browser, not the pipeline), then refresh the connection.
