live_apps:
  - name: Store Performance Cockpit
    prompt: live_app_prompt.md
    tabs: [Executive Overview, Store Gap Lab, Implementation Plan]
  - name: Kampanjrapport
    key: kampanjrapport
    prompt: live_app_prompt_kampanjrapport.md
    tabs: [Rapporten, Förklara och kostnad, Orderjustering]

chats:
  - followup_question: Why is Grosshallen Västerhamn underperforming its catchment potential and are late inbound purchase orders from the import suppliers part of its non-food availability problem?
    expected_points:
      - Västerhamn sells roughly 62 percent of its catchment potential versus about 90 percent for its peer cluster
      - the gap is driven by fewer transactions rather than smaller baskets
      - Dairy and Bread on-shelf availability is the worst in the banner at about 91 percent
      - Families segment visits fell more than 10 percent and the Billigmat discount store opened 1.1 km away in March 2026
      - non-food lost sales concentrate in SKUs from three import suppliers whose purchase orders arrive late (named from the Teradata purchasing data)
      - Grosshallen Nordstaden is the peer playbook with higher private label share better availability and fewer markdowns
  - name: kampanjrapport skill
    key: kampanjrapport
    followup_question: /kampanjrapport Kronmat 2026-W36
    expected_points:
      - 28 article rows across four Kronmat campaigns in week 2026-W36 (Höstskörd)
      - actual sold about 615 thousand units with the chain purchase forecast about 18 percent over and CatBoost about 6 percent over
      - Multiköp 3 för 2 has the largest chain-forecast bias of the tactic types that week
  - name: explain and cost
    key: explain_cost
    followup_question: Why is forecast error highest on Multiköp 3 för 2 campaigns over the last 13 campaign weeks and what did the over-forecast cost us in margin in Q3 2026?
    expected_points:
      - the chain purchase forecast over-forecasts Multiköp 3 för 2 perishables by about 31 percent while other tactic types stay within about 9 percent
      - perishables carry most of the absolute forecast error (about 87 percent)
      - Grosshallen Västerhamn is the worst store on campaign forecast deviation and its deviation jumped after the Billigmat opening in March 2026
      - over-forecasting cost about SEK 10.8 million of margin in Q3 2026 mostly as perishable waste with Kronmat Multiköp the largest share
      - the cost figures are labelled illustrative because the finance system is not migrated
      - a recommendation to cap the chain plan at the CatBoost forecast on perishable multibuy campaigns or review the flagged upcoming campaigns

