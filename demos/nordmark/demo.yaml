name: nordmark
title: Nordmark Dagligvaror
vertical: Retail
built_for: Axfood conversation via the Teradata partner team (Swedish grocery group; synthetic data in Snowflake, federated read-only Teradata sourcing tables; no prospect names appear in the data)
as_of: 2026-09-30
data_start: 2024-10-01
seed: 20261026
inputs: [inputs/ali_slack_notes.md, inputs/axfood_demo_brief_teradata.pdf, inputs/teradata_call_2026-10-27_transcript.md]

persona:
  primary: Head of Store Operations (group) with the FP&A business-analytics team
  secondary: [Grosshallen banner director, Category manager Fresh & Produce, Loyalty and CRM lead, Data steward (Dagab-style analytics mart)]
  kpis: [net sales and like-for-like growth, gross profit and margin percent, transactions and average basket, on-shelf availability and stockouts, waste and markdowns, active loyalty members and visit frequency, sales versus catchment potential]

snowflake:
  database: NORDMARK_POC
  schema: ANALYTICS
  ddl: 01_snowflake_ddl.sql
  load_order: [CALENDAR, BANNERS, NEIGHBORHOODS, STORES, PRODUCT_CATEGORIES, NONFOOD_ASSORTMENT, PROMOTIONS,
               STORE_DAILY_SALES, SALES_WEEKLY_STORE_CATEGORY, STORE_MONTHLY_COSTS, PROMOTION_RESULTS,
               LOYALTY_ACTIVITY_MONTHLY, STORE_ASSORTMENT_MONTHLY, COMPETITOR_EVENTS, NONFOOD_AVAILABILITY_MONTHLY,
               ARTIKEL, KAMPANJ, ARTIKEL_KOSTNAD_MANAD, KAMPANJ_ARTIKEL_VECKA, KAMPANJ_BUTIK_VECKA,
               DATA_DICTIONARY]
  views: [V_KPI_STORE_MONTHLY, V_BANNER_KPI_MONTHLY, V_STORE_GAP_DECOMPOSITION, V_PEER_COMPARISON, V_CATCHMENT_POTENTIAL,
          V_PROMO_EFFECTIVENESS, V_AVAILABILITY_VS_SALES, V_LOYALTY_SEGMENT_TRENDS, V_NONFOOD_AVAILABILITY_BY_SUPPLIER,
          V_KAMPANJRAPPORT, V_PROGNOSFEL_TAKTIK, V_KAMPANJ_BUTIK_AVVIKELSE, V_KAMPANJ_MARGINALEFFEKT, V_KAMPANJ_KOMMANDE]
  expected_rows:
    CALENDAR: 822
    BANNERS: 3
    NEIGHBORHOODS: 249
    STORES: 249
    PRODUCT_CATEGORIES: 23
    NONFOOD_ASSORTMENT: 250
    PROMOTIONS: 60
    STORE_DAILY_SALES: 175806
    SALES_WEEKLY_STORE_CATEGORY: 453930
    STORE_MONTHLY_COSTS: 5787
    PROMOTION_RESULTS: 5260
    LOYALTY_ACTIVITY_MONTHLY: 34722
    STORE_ASSORTMENT_MONTHLY: 103845
    COMPETITOR_EVENTS: 73
    NONFOOD_AVAILABILITY_MONTHLY: 199250
    ARTIKEL: 1200
    KAMPANJ: 150
    ARTIKEL_KOSTNAD_MANAD: 31200
    KAMPANJ_ARTIKEL_VECKA: 7327
    KAMPANJ_BUTIK_VECKA: 15364
    DATA_DICTIONARY: 41

generator:
  module: generator.py
  checks: checks.py
  constants:
    GROUP_NAME: Nordmark Dagligvaror
    BANNER_DISCOUNT: Kronmat
    BANNER_NEIGHBOURHOOD: Torghallen
    BANNER_HYPERMARKET: Grosshallen
    HYPERMARKET_ACQUIRED: 2025-01-01
    HERO_STORE: Grosshallen Västerhamn
    PEER_STORE: Grosshallen Nordstaden
    CONVERTED_STORE: Grosshallen Sundsvik
    CONVERTED_ON: 2026-08-15
    HERO_PROMOTION: Sommarpris 2026
    HERO_CATEGORY: Fresh & Produce
    COMPETITOR_NAME: Billigmat
    COMPETITOR_OPENED: 2026-03-12
    COMPETITOR_DISTANCE_KM: 1.1
    HERO_SEGMENT: Families
    VAT_CUT_DATE: 2026-04-01
    LATE_SUPPLIER_COUNT: 3
    NONFOOD_SKU_COUNT: 250
    HERO_CAMPAIGN_WEEK: 2026-W36
    HERO_CAMPAIGN: "Höstskörd 3 för 2"
    HERO_TACTIC: "Multiköp 3 för 2"
    DRAFT_CAMPAIGN: "Äpplen & Päron"
    DRAFT_WEEK: 2026-W42

control_points:
  - id: CP1
    name: "Grosshallen like-for-like lags the group and the gap is transactions not basket; Västerhamn sells far below its catchment potential"
    hero: Grosshallen Västerhamn
    targets:
      - {metric: grosshallen_lfl_r12_pct, op: "<=", value: -0.010}
      - {metric: group_lfl_minus_grosshallen_pts, op: ">=", value: 0.025}
      - {metric: grosshallen_transactions_change_pct, op: "<=", value: -0.050}
      - {metric: grosshallen_basket_change_pct, op: ">=", value: 0.030}
      - {metric: grosshallen_gp_pct_gap_vs_kronmat_pts, op: ">=", value: 0.020}
      - {metric: grosshallen_ebit_q3_2026_sek, op: ">=", value: 0}
      - {metric: grosshallen_ebit_q3_2025_sek, op: "<=", value: -5000000}
      - {metric: vasterhamn_potential_index, op: "<=", value: 0.65}
      - {metric: vasterhamn_cluster_median_index, op: ">=", value: 0.85}
      - {metric: vasterhamn_is_largest_sek_gap_in_banner, op: "==", value: 1}
  - id: CP2
    name: "Kronmat Fresh & Produce grows while its margin erodes; Sommarpris 2026 has top uplift and bottom margin"
    hero: Sommarpris 2026
    targets:
      - {metric: kronmat_fresh_sales_growth_pct, op: ">=", value: 0.07}
      - {metric: kronmat_fresh_gp_pct_change_pts, op: "<=", value: -0.018}
      - {metric: sommarpris_uplift_rank, op: "<=", value: 3}
      - {metric: sommarpris_margin_rank_from_bottom, op: "<=", value: 3}
  - id: CP3
    name: "Dairy and Bread availability below 94 percent lines up with weaker like-for-like; Västerhamn has the worst availability in its banner"
    hero: Grosshallen Västerhamn
    targets:
      - {metric: low_osa_lfl_gap_pts, op: ">=", value: 0.03}
      - {metric: vasterhamn_osa_dairy_bread_pct, op: "<=", value: 0.915}
      - {metric: vasterhamn_is_worst_osa_in_banner, op: "==", value: 1}
  - id: CP4
    name: "Families visit Grosshallen less while other banners hold; a discount competitor opened 1.1 km from Västerhamn"
    hero: Families
    targets:
      - {metric: grosshallen_families_visits_change_pct, op: "<=", value: -0.10}
      - {metric: other_banners_families_vs_total_visits_gap_pts, op: "<=", value: 0.03}   # Families move with total visits elsewhere
      - {metric: vasterhamn_competitor_distance_km, op: "<=", value: 1.5}
      - {metric: vasterhamn_sales_change_after_opening_pct, op: "<=", value: -0.06}
  - id: CP5
    name: "Peer store Nordstaden shows the playbook: higher private label share better availability and fewer markdowns"
    hero: Grosshallen Nordstaden
    targets:
      - {metric: nordstaden_pl_share_minus_vasterhamn_pts, op: ">=", value: 0.05}
      - {metric: nordstaden_osa_pct, op: ">=", value: 0.965}
      - {metric: nordstaden_markdown_rate_ratio_vs_vasterhamn, op: "<=", value: 0.75}
      - {metric: nordstaden_potential_index, op: ">=", value: 0.95}
  - id: CP6
    name: "Grosshallen non-food lost sales concentrate in SKUs from the three import suppliers whose purchase orders run late in the Teradata purchasing platform"
    hero: Grosshallen Västerhamn
    targets:
      - {metric: late_supplier_share_of_nonfood_lost_sales, op: ">=", value: 0.55}
      - {metric: late_supplier_count, op: "==", value: 3}
      - {metric: vasterhamn_nonfood_osa_pct, op: "<=", value: 0.93}
  - id: CP7
    name: "Kampanjrapport recreates the MicroStrategy grid for Kronmat week 2026-W36: the chain purchase forecast lands 18 percent over actual and CatBoost 6 percent"
    hero: "Höstskörd 3 för 2"
    targets:
      - {metric: kronmat_w36_rows, op: "==", value: 28}
      - {metric: kronmat_w36_tactic_types, op: ">=", value: 4}
      - {metric: kronmat_w36_nyckel_unique, op: "==", value: 1}
      - {metric: kronmat_w36_kedjan_bias_pct, op: ">=", value: 0.15}
      - {metric: kronmat_w36_kedjan_bias_pct_max, op: "<=", value: 0.22}
      - {metric: kronmat_w36_catboost_bias_pct, op: "<=", value: 0.09}
  - id: CP8
    name: "Forecast error is highest on Multiköp perishables and worst at Grosshallen Västerhamn after the competitor opening; Nordstaden is in the best quartile"
    hero: "Multiköp 3 för 2"
    targets:
      - {metric: multikop_perishable_bias_pct, op: ">=", value: 0.25}
      - {metric: other_tactics_max_bias_pct, op: "<=", value: 0.10}
      - {metric: perishable_share_of_abs_error, op: ">=", value: 0.60}
      - {metric: vasterhamn_overforecast_after_opening_pct, op: ">=", value: 0.35}
      - {metric: vasterhamn_is_worst_grosshallen_store, op: "==", value: 1}
      - {metric: nordstaden_in_best_quartile, op: "==", value: 1}
  - id: CP9
    name: "Over-forecasting costs margin on the illustrative cost data: SEK 9-15 m in Q3 2026 mostly perishable waste with Kronmat Multiköp the largest share"
    hero: Kronmat
    targets:
      - {metric: q3_2026_marginaleffekt_sek, op: ">=", value: 9000000}
      - {metric: q3_2026_marginaleffekt_sek_max, op: "<=", value: 15000000}
      - {metric: q3_2026_perishable_waste_share, op: ">=", value: 0.55}
      - {metric: kronmat_multikop_is_largest_share, op: "==", value: 1}
  - id: CP10
    name: "Upcoming perishable campaigns whose chain forecast exceeds CatBoost by more than 15 percent are flagged before delivery"
    hero: "Äpplen & Päron"
    targets:
      - {metric: upcoming_perishable_campaigns_flagged, op: ">=", value: 3}
      - {metric: upcoming_dry_rows_flagged, op: "<=", value: 1}
  - id: CP11
    name: "The order adjustment draft for Äpplen & Päron week 2026-W42 cuts the purchase 15-22 percent in whole layers and protects at least SEK 300k of margin"
    hero: "Äpplen & Päron"
    targets:
      - {metric: applen_paron_w42_flagged, op: "==", value: 1}
      - {metric: applen_paron_w42_cut_pct, op: ">=", value: 0.15}
      - {metric: applen_paron_w42_cut_pct_max, op: "<=", value: 0.22}
      - {metric: applen_paron_w42_skyddad_marginal_sek, op: ">=", value: 300000}

